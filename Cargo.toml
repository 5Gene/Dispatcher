[workspace]
resolver = "2"
members = [
    "action_dispatch",
    "action_dispatch_core",
    "action_dispatch_macro",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["jonas.jzy@gmail.com"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/5Gene/Dispatcher"
description = "通用的基于属性宏的 Action 注册与分发系统"  # ✅ 描述
keywords = ["action", "dispatch", "macro", "event", "handler"]  # ✅ 关键词
categories = ["rust-patterns", "asynchronous"]  # ✅ 分类
homepage = "https://github.com/5Gene"


[workspace.dependencies]
# 核心依赖（升级到最新版本）
regex = "1.11"          # 1.10 → 1.11
once_cell = "1.20"      # 1.19 → 1.20
inventory = "0.3"       # 已是最新
aho-corasick = "1.1"    # 多模式字符串匹配，用于优化复杂正则的预过滤

# 宏依赖（升级到最新版本）
syn = { version = "2.0", features = ["full"] }  # 已是最新 2.x
quote = "1.0"           # 已是最新 1.x
proc-macro2 = "1.0"     # 已是最新 1.x

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

